services:
  postgres:
    image: postgres:17
    container_name: lelvo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lelvo
      POSTGRES_PASSWORD: lelvo_password
      POSTGRES_DB: lelvo
    ports:
      - "5432:5432"
    volumes:
      - lelvo_postgres_data:/var/lib/postgresql/data

volumes:
  lelvo_postgres_data: